name: Clone and Merge Repositories
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: repo-merge
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet publish RepoMerger -c Release -o out
      - name: Merge repositories and push
        id: merge
        continue-on-error: true
        run: bash .github/scripts/run-and-push.sh merge
      - name: Open alert issue
        if: always() && hashFiles('alert.md') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const lines = fs.readFileSync('alert.md', 'utf8').split('\n');
            const title = lines[0].trim();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${lines.slice(1).join('\n').trim()}\n\n[Workflow run](${runUrl}) | See REPORT.md for full details.`;
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', labels: 'repo-merge-issues' });
            if (open.some(i => i.title === title)) return;
            await github.rest.issues.create({ ...context.repo, title, body, labels: ['automated', 'repo-merge-issues'] });
      - name: Summary
        if: always()
        run: |
          if [ -f stats.txt ]; then
            {
              echo "## Plugin Repository Merge Summary"
              echo ""
              echo "| Metric | Value |"
              echo "|--------|-------|"
              sed -E 's/^([a-z_]+)=(.*)$/| \1 | \2 |/' stats.txt
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Merge failed - no stats generated" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fail the job if the merge failed
        if: steps.merge.outcome == 'failure'
        run: exit 1
